<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gospel Wonders Mission Church</title>

    <!-- FAVICON -->
    <link rel="icon" type="image/png" href="keith.PNG">

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>

        /* =========================================
           RESET
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: "Inter", sans-serif;
            background: #07111f;
            color: white;
        }


        /* =========================================
           HEADER
        ========================================= */

        .header {
            width: 100%;
            height: 75px;

            padding: 0 5%;

            display: flex;
            align-items: center;
            justify-content: space-between;

            position: fixed;
            top: 0;
            left: 0;

            z-index: 1000;

            background: rgba(7, 17, 31, 0.92);

            backdrop-filter: blur(15px);

            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
        }


        /* =========================================
           CHURCH LOGO
        ========================================= */

        .logo {
            display: flex;
            align-items: center;

            gap: 10px;

            text-decoration: none;

            color: white;

            flex-shrink: 0;
        }


        /* ACTUAL CHURCH LOGO IMAGE */

        .logo img {
            width: 40px;
            height: 40px;

            object-fit: contain;

            display: block;

            border-radius: 5px;

            transition: 0.3s ease;
        }


        /* LOGO HOVER */

        .logo:hover img {
            transform: scale(1.08);
        }


        /* =========================================
           LOGO TEXT
        ========================================= */

        .logo-text {
            display: flex;

            flex-direction: column;

            justify-content: center;

            line-height: 1;
        }


        .logo-text strong {
            font-family: "Cormorant Garamond", serif;

            font-size: 20px;

            font-weight: 700;

            color: #d4af37;

            white-space: nowrap;
        }


        .logo-text span {
            margin-top: 4px;

            font-size: 8px;

            font-weight: 600;

            letter-spacing: 2.5px;

            text-transform: uppercase;

            color: #ffffff;

            white-space: nowrap;
        }


        /* =========================================
           NAVIGATION
        ========================================= */

        .navbar {
            display: flex;

            align-items: center;

            gap: 25px;
        }


        .navbar a {
            text-decoration: none;

            color: white;

            font-size: 14px;

            font-weight: 500;

            transition: 0.3s ease;

            position: relative;
        }


        .navbar a:hover {
            color: #d4af37;
        }


        .navbar a.active {
            color: #d4af37;
        }


        .navbar a.active::after {
            content: "";

            position: absolute;

            left: 0;
            bottom: -8px;

            width: 100%;
            height: 2px;

            background: #d4af37;
        }


        /* =========================================
           DONATE BUTTON
        ========================================= */

        .donate-btn {
            padding: 10px 18px;

            background: #d4af37;

            color: #07111f !important;

            border-radius: 5px;

            font-weight: 700 !important;
        }


        .donate-btn:hover {
            background: #f0d46a;
        }


        /* =========================================
           THEME BUTTON
        ========================================= */

        .theme-toggle {
            border: none;

            background: transparent;

            color: white;

            font-size: 20px;

            cursor: pointer;

            margin-left: 15px;
        }


        /* =========================================
           MOBILE MENU BUTTON
        ========================================= */

        .menu-toggle {
            display: none;

            border: none;

            background: transparent;

            color: white;

            font-size: 25px;

            cursor: pointer;
        }


        /* =========================================
           DEMO HERO
        ========================================= */

        .hero {
            min-height: 100vh;

            padding: 150px 8% 80px;

            display: flex;

            align-items: center;

            background:
                linear-gradient(
                    rgba(7, 17, 31, 0.78),
                    rgba(7, 17, 31, 0.92)
                ),
                url("church.jpg");

            background-size: cover;

            background-position: center;
        }


        .hero-content {
            max-width: 750px;
        }


        .hero small {
            color: #d4af37;

            letter-spacing: 4px;

            font-weight: 700;
        }


        .hero h1 {
            font-family: "Cormorant Garamond", serif;

            font-size: 65px;

            line-height: 0.95;

            margin: 20px 0;
        }


        .hero h1 span {
            color: #d4af37;
        }


        .hero p {
            max-width: 650px;

            line-height: 1.8;

            color: #d6dbe2;
        }


        .hero-buttons {
            display: flex;

            gap: 15px;

            margin-top: 30px;
        }


        .btn {
            padding: 13px 22px;

            text-decoration: none;

            border-radius: 5px;

            font-weight: 600;

            transition: 0.3s ease;
        }


        .btn-primary {
            background: #d4af37;

            color: #07111f;
        }


        .btn-primary:hover {
            background: #f0d46a;

            transform: translateY(-2px);
        }


        .btn-outline {
            border: 1px solid #d4af37;

            color: #d4af37;
        }


        .btn-outline:hover {
            background: #d4af37;

            color: #07111f;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 900px) {

            .menu-toggle {
                display: block;
            }


            .navbar {
                position: absolute;

                top: 75px;

                left: 0;

                width: 100%;

                padding: 25px;

                display: none;

                flex-direction: column;

                align-items: center;

                gap: 20px;

                background: #07111f;

                border-top: 1px solid rgba(212,175,55,0.2);
            }


            .navbar.active {
                display: flex;
            }


            .theme-toggle {
                margin-left: auto;

                margin-right: 15px;
            }

        }


        /* =========================================
           SMALL PHONES
        ========================================= */

        @media (max-width: 600px) {

            .header {
                height: 68px;

                padding: 0 4%;
            }


            .logo img {
                width: 36px;

                height: 36px;
            }


            .logo-text strong {
                font-size: 16px;
            }


            .logo-text span {
                font-size: 7px;

                letter-spacing: 2px;
            }


            .hero {
                padding: 130px 6% 60px;
            }


            .hero h1 {
                font-size: 45px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         NAVIGATION
    ========================================= -->

    <header class="header">


        <!-- CHURCH LOGO -->

        <a href="index.html" class="logo">

            <img
                src="keith.PNG"
                alt="Gospel Wonders Mission Church Logo"
            >

            <div class="logo-text">

                <strong>
                    Gospel Wonders
                </strong>

                <span>
                    Mission Church
                </span>

            </div>

        </a>


        <!-- MOBILE MENU -->

        <button class="menu-toggle" id="menuToggle">
            <i class="fa-solid fa-bars"></i>
        </button>


        <!-- NAVIGATION LINKS -->

        <nav class="navbar" id="navbar">

            <a href="index.html" class="active">
                Home
            </a>

            <a href="about.HTML">
                About
            </a>

            <a href="ministries.HTML">
                Ministries
            </a>

            <a href="sermons.HTML">
                Sermons
            </a>

            <a href="events.html">
                Events
            </a>

            <a href="gallery.HTML">
                Gallery
            </a>

            <a href="contact.html">
                Contact
            </a>

            <a href="donate.html" class="donate-btn">
                Donate
            </a>

        </nav>


        <!-- DARK/LIGHT MODE -->

        <button class="theme-toggle" id="themeToggle">
            🌙
        </button>


    </header>


    <!-- =========================================
         HERO
    ========================================= -->

    <section class="hero">

        <div class="hero-content">

            <small>
                WELCOME TO
            </small>

            <h1>
                GOSPEL
                <span>WONDERS MISSION CHURCH</span>
            </h1>

            <p>
                Spreading God's Word, transforming lives,
                and serving communities through faith,
                love and hope.
            </p>


            <div class="hero-buttons">

                <a href="about.HTML" class="btn btn-primary">
                    Learn More
                </a>

                <a href="donate.html" class="btn btn-outline">
                    Support Mission
                </a>

            </div>

        </div>

    </section>


    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>

        /* MOBILE MENU */

        const menuToggle =
            document.getElementById("menuToggle");

        const navbar =
            document.getElementById("navbar");


        menuToggle.addEventListener("click", function () {

            navbar.classList.toggle("active");

            const icon =
                menuToggle.querySelector("i");

            if (navbar.classList.contains("active")) {

                icon.classList.remove("fa-bars");

                icon.classList.add("fa-xmark");

            } else {

                icon.classList.remove("fa-xmark");

                icon.classList.add("fa-bars");

            }

        });


        /* =========================================
           THEME TOGGLE
        ========================================= */

        const themeToggle =
            document.getElementById("themeToggle");


        themeToggle.addEventListener("click", function () {

            document.body.classList.toggle("light-mode");


            if (
                document.body.classList.contains("light-mode")
            ) {

                themeToggle.textContent = "☀️";

            } else {

                themeToggle.textContent = "🌙";

            }

        });

    </script>


</body>

</html>
